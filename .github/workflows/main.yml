name: Rakit APK

on:
  push:
  workflow_dispatch:

jobs:
  rakit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buka zip proyek
        run: unzip -o "$(ls *.zip | head -1)" -d proyek
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Rakit APK
        working-directory: proyek
        run: gradle assembleRelease --no-daemon
      - name: Ambil APK
        run: cp proyek/app/build/outputs/apk/release/app-release.apk penangkap.apk
      - uses: actions/upload-artifact@v4
        with:
          name: penangkap-dana-apk
          path: penangkap.apk
